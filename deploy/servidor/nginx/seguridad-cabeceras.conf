# Las cabeceras de seguridad, en un solo lugar.
#
# Van incluidas en el servidor Y dentro de cada location que tenga su propio
# add_header: nginx no las suma, las reemplaza. Un solo add_header adentro de
# un location borra TODOS los heredados de afuera, y la página quedaría sin
# protección sin que nada avise.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation=(self): la plataforma misma sí la usa (técnicos en el mapa, ubicación al
# cerrar una instalación, «Dónde estoy» de los mapas). Con geolocation=() el navegador
# la negaba siempre aunque el técnico la tuviera permitida (19-10). Terceros embebidos, no.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
