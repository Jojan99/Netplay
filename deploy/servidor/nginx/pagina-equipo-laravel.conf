# Llamada a Laravel desde el puente de equipos.netvula.com. Cada location pone su
# REQUEST_URI, QUERY_STRING y REQUEST_METHOD (no se incluye fastcgi_params entero
# para no mandarlos dos veces). PAGINA_EQUIPO_INTERNO es lo que el controlador
# exige: desde el panel normal esas rutas contestan 404.
fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
fastcgi_param SCRIPT_FILENAME /var/www/netplay/public/index.php;
fastcgi_param SCRIPT_NAME     /index.php;
fastcgi_param DOCUMENT_ROOT   /var/www/netplay/public;
fastcgi_param SERVER_PROTOCOL $server_protocol;
fastcgi_param REQUEST_SCHEME  https;
fastcgi_param HTTPS           on;
fastcgi_param SERVER_NAME     $host;
fastcgi_param SERVER_PORT     443;
fastcgi_param HTTP_HOST       $host;
fastcgi_param REMOTE_ADDR     $remote_addr;
fastcgi_param HTTP_COOKIE     $http_cookie;
fastcgi_param HTTP_USER_AGENT $http_user_agent;
fastcgi_param PAGINA_EQUIPO_INTERNO 1;
